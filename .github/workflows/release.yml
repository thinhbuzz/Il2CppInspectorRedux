name: Il2CppInspectorRedux Release
on:
  push:
    tags:
      - '*'

jobs:
  build_artifacts:
    name: Build artifacts
    uses: ./.github/workflows/build.yml
  make_release:
    name: Create release
    needs: build_artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts/
      - name: Create artifact ZIPs
        shell: pwsh
        working-directory: ./artifacts
        run: 'Get-ChildItem -Path . -Directory | ForEach-Object { Compress-Archive -Path $_.Name -DestinationPath "$($_.Name).zip"  }'
      - name: Delete unzipped artifact folders
        shell: pwsh
        working-directory: ./artifacts
        # -Force is required: the CLI artifacts contain hidden files (bun-builder/.gitignore),
        # and Remove-Item refuses to recurse into hidden/read-only items without it.
        run: 'Get-ChildItem -Path . -Directory -Force | ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force }'
      - name: Make release
        uses: softprops/action-gh-release@v3
        with:
          files: ./artifacts/**/*
          name: Il2CppInspectorRedux ${{ github.ref_name }}
          generate_release_notes: false